name: Publish verified 0.3.0 to PyPI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pypi-intelligent-futures-0.3.0
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download and verify immutable release artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir dist
          base=https://github.com/yflop/concurrent-futures-ai/releases/download/v0.3.0
          curl --fail --location --retry 3 "$base/intelligent_futures-0.3.0-py3-none-any.whl" -o dist/intelligent_futures-0.3.0-py3-none-any.whl
          curl --fail --location --retry 3 "$base/intelligent_futures-0.3.0.tar.gz" -o dist/intelligent_futures-0.3.0.tar.gz
          printf '%s\n' \
            '1095054655a7c9f3ecfb78319ba14b918975585a3041d31fd75baeb279d83bd7  dist/intelligent_futures-0.3.0-py3-none-any.whl' \
            'b45937a9080ec3576e6534af9a6dea797fe5540b3ad314ceca8d63b1814eef6a  dist/intelligent_futures-0.3.0.tar.gz' \
            | sha256sum --check --strict

      - name: Install official PyPI upload tooling
        run: |
          python3 -m venv .upload-venv
          .upload-venv/bin/python -m pip install --disable-pip-version-check twine==6.2.0 packaging==25.0

      - name: Validate distributions
        run: .upload-venv/bin/python -m twine check --strict dist/*

      - name: Publish verified distributions
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
          TWINE_NON_INTERACTIVE: '1'
        run: .upload-venv/bin/python -m twine upload --repository-url https://upload.pypi.org/legacy/ dist/*
