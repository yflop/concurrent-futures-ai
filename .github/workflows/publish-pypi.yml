name: Publish verified 0.1.0 to PyPI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pypi-intelligent-futures-0.1.0
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download and verify immutable release artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir dist
          base=https://github.com/yflop/concurrent-futures-ai/releases/download/v0.1.0
          curl --fail --location --retry 3 "$base/intelligent_futures-0.1.0-py3-none-any.whl" -o dist/intelligent_futures-0.1.0-py3-none-any.whl
          curl --fail --location --retry 3 "$base/intelligent_futures-0.1.0.tar.gz" -o dist/intelligent_futures-0.1.0.tar.gz
          printf '%s\n' \
            'a6e72369e4bc83bdd0404304f809879f365fa4c3ae39d73ca61a613ae5977875  dist/intelligent_futures-0.1.0-py3-none-any.whl' \
            '73a188d9eef63380edcc6ea0da8d0dab82e931b13bde7f7f5174565d9c6dee40  dist/intelligent_futures-0.1.0.tar.gz' \
            | sha256sum --check --strict

      - name: Install official PyPI upload tooling
        run: |
          python3 -m venv .upload-venv
          .upload-venv/bin/python -m pip install --disable-pip-version-check twine==6.2.0 packaging==25.0

      - name: Validate distributions
        run: .upload-venv/bin/python -m twine check --strict dist/*

      - name: Publish verified distributions
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
          TWINE_NON_INTERACTIVE: '1'
        run: .upload-venv/bin/python -m twine upload --repository-url https://upload.pypi.org/legacy/ dist/*
