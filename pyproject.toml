[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "intelligent-futures"
version = "0.5.1"
description = "Intelligent Futures is a workload-aware execution framework for Python that automates the evaluation and selection of concurrency configurations. It combines execution policies, workload characteristics, runtime measurements, and adaptive optimisation to help identify effective thread and process execution strategies under defined resource constraints."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
classifiers = ["Development Status :: 4 - Beta", "Programming Language :: Python :: 3", "Topic :: System :: Distributed Computing"]
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=2.3,<3"]
workloads = ["Pillow>=10,<13", "requests>=2.32,<3", "requests-cache>=1.2,<2", "networkx>=3.2,<4", "psutil>=5.9,<8"]

[project.urls]
Repository = "https://github.com/yflop/concurrent-futures-ai"
Issues = "https://github.com/yflop/concurrent-futures-ai/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
intelligent_futures = ["py.typed", "concepts.json"]
