[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "intelligent-futures"
version = "0.2.0"
description = "Measured, safety-first adaptive scheduling on Python concurrent.futures"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Topic :: System :: Distributed Computing"]
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=2.3,<3"]

[project.urls]
Repository = "https://github.com/yflop/concurrent-futures-ai"
Issues = "https://github.com/yflop/concurrent-futures-ai/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
intelligent_futures = ["py.typed", "concepts.json"]
